<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/photo-01.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>West View Lodge | Luxury Lakefront Retreat on Big Lake · Mount Vernon, WA</title>
    <meta name="description" content="Book direct & save ~14% at West View Lodge on Big Lake in Mount Vernon, WA (Skagit Valley). 4,300 sq. ft. luxury lakefront lodge sleeping 20+ with private dock, watercraft fleet, hot tub, fire pit, 2 kitchens, and 7 bedrooms." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-alabaster text-lodge font-sans antialiased selection:bg-cedar/20 selection:text-lodge">
    <!-- Hidden Netlify Form for static detection at build/deploy time -->
    <form name="west-view-lodge-direct-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="checkIn" />
      <input type="text" name="checkOut" />
      <input type="number" name="nights" />
      <input type="number" name="guests" />
      <input type="text" name="occasion" />
      <input type="text" name="estimatedSavings" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
