<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/photo-01.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>West View Lodge | Lakefront Retreat on Big Lake · Mount Vernon, WA</title>
    <meta name="description" content="Book direct & save ~14% at West View Lodge on Big Lake in Mount Vernon, WA (Skagit Valley). 4,300 sq. ft. lakefront lodge sleeping 20+ with private dock, included watercraft, hot tub, lakeside fire pit, 2 kitchens, and 7 bedrooms." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-alabaster text-lodge font-sans antialiased selection:bg-cedar/20 selection:text-lodge">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        function removeNetlifyBadge() {
          var selectors = [
            'a[href*="netlify.com"]',
            'a[href*="netlify.app"][target="_blank"]:not(#root a)',
            'iframe[src*="netlify"]',
            'iframe[title*="Netlify" i]',
            'div[id*="netlify"]',
            'div[class*="netlify"]',
            '#netlify-badge',
            '[data-netlify-badge]'
          ];
          selectors.forEach(function (sel) {
            document.querySelectorAll(sel).forEach(function (el) {
              if (!el.closest('#root')) {
                el.style.setProperty('display', 'none', 'important');
                el.style.setProperty('visibility', 'hidden', 'important');
                el.style.setProperty('opacity', '0', 'important');
                el.style.setProperty('pointer-events', 'none', 'important');
                el.remove();
              }
            });
          });
        }
        removeNetlifyBadge();
        var observer = new MutationObserver(removeNetlifyBadge);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
